<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>For You ❤️</h1>

  <!-- Reveal Button -->
  <button id="reveal-btn">💌 Open Letter</button>

  <!-- Hidden letter initially -->
  <div class="letter" id="letter">
    <p class="message">
      <!-- ✨ You can replace this text below with your love letter -->
      My dearest,

      Every word I write carries a piece of my heart.
      This little website is my way of saying what words sometimes can’t:
      You are the reason my world feels brighter every day.

      Always yours,
      — Kenan
    </p>
  </div>

  <audio id="bg-music" loop>
    <source src="your-music.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
